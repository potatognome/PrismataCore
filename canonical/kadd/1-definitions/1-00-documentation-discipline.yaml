  schema:
    cmf:
      required_fields:
        - id
        - udi
        - kind
        - version
        - tenant
        - source
        - metadata
        - relations
        - notes
        - content
  governance:
    statuses:
      - stub
      - draft
      - in-review
      - changes-requested
      - approved
      - deprecated
      - archived
    status-guidelines:
      lifecycle-status:
        purpose: Tracks the governance state of the entire KAD document.
        values:
          - stub
          - draft
          - in-review
          - changes-requested
          - approved
          - deprecated
          - archived
      review-status:
        purpose: Tracks the result or current state of a formal document review.
        values:
          - not-reviewed
          - ready-for-review
          - in-review
          - passed-review
          - changes-requested
          - deprecated
          - archived
      maturity:
        purpose: >
          Describes descriptive completeness and stability of document content.
          Maturity is not a lifecycle status and may use domain-appropriate values.
      item-status:
        purpose: >
          Tracks status for domain objects inside a KAD, such as roadmap items,
          lessons learned records, and runtime objects.
        rule: >
          Item status sets are defined by the containing KAD and must not reuse
          document lifecycle or review-status values unless intentionally identical.
      naming:
        rule: Use lowercase kebab-case for status values.
        examples:
          - passed-review
          - changes-requested
          - ready-for-review
        prohibited:
          - "passed review"
          - "ready for review"
          - "approved-for-review"
    validation:
      require_standard_filenames: true
      require_cmf_envelope: true
      require_metadata_status: true
      require_content_section: true
      require_document_id: true
      require_document_layer: true
      require_document_category: true
      allow_additional_documents: true
      allow_layer_expansion: true
      allow_custom_documents: true
      preserve_unknown_documents: true
  automation:
    agent_behavior:
      prompt_for_missing_files: true
      prompt_for_stub_documents: true
      prompt_for_empty_content: true
      prompt_for_missing_required_sections: true
      allow_future_extensions: true
      suggest_next_document_by_layer: true
      suggest_architecture_before_implementation: true
      report_project_completeness: true
      report_layer_completeness: true
      identify_missing_dependencies: true
      identify_unreferenced_documents: true
      identify_orphaned_documents: true
    tooling:
      standard_is_source_of_truth: true
      scaffold_from_standard: true
      validate_from_standard: true
      migrate_from_standard: true
      report_from_standard: true
      dashboard_from_standard: true
      agent_analysis_from_standard: true