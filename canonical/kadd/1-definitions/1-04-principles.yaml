metadata:
  name: Prismata Principles
  description: Foundational principles that guide design, architecture, governance, and evolution within the Prismata ecosystem.
  tags:
    - prismata
    - principles
    - governance
    - architecture
    - metadata

relations:
  domain:
    - Foundational Principles
    - Knowledge Architecture
    - Cybernetic Systems

  scope:
    - Decision Guidance
    - Design Philosophy
    - Architectural Thinking

  exclusions:
    - Laws
    - Architecture
    - Requirements
    - Implementation Details
    - Technology Selection

  priority: critical

  conflict-resolution: >
    Principles guide decisions when multiple valid
    approaches exist.

  imports:
    - prismata.kad.definitions.documentation-discipline
    - prismata.kad.definitions.vision
    - prismata.kad.definitions.project-profile
