  updated: 2026-10-28
  path: PrismataCore/.github/plan-docs.d/doc-std-001.yaml

metadata:
  name: Project Documentation Standard
  description: >
    Layered architecture-first documentation standard.
  tags:
    - plan-documents
    - standards
    - project-documentation

relations:
  domain: planning
  scope: null
  exclusions: null
  priority: high
  conflict-resolution: null
  imports: null

notes:
  - Layered architecture-first documentation standard intended for planning, architecture, implementation, operation, and long-term project knowledge management.
  - Objective: Establish a clear and consistent approach to project documentation that supports planning, architecture, implementation, operation, and long-term knowledge management.
  - The documentation standard itself is a CMF document and serves as the authoritative schema for documentation generation, validation, migration, reporting, and agent-assisted project analysis.

content:
  standard:
    layers:
      1:
        name: Definition
        purpose: >
          Define project identity, purpose, terminology,
          scope, and conceptual foundation.
        description: >
          Defines project purpose, identity,
          terminology, and conceptual foundation.
        prerequisites: []
        outputs:
          - concepts
          - architecture
      2:
        name: Architecture
        purpose: >
          Define system structure, responsibilities,
          boundaries, relationships, and architectural decisions.
        description: >
          Defines systems, subsystems,
          relationships, and architectural decisions.
        prerequisites:
          - layer-1
        outputs:
          - planning
          - implementation
      3:
        name: Planning
        purpose: >
          Define what should be built,
          why it should be built,
          and how work should be prioritized.
        description: >
          Defines requirements, risks,
          roadmap, and planning artifacts.
        prerequisites:
          - layer-1
          - layer-2
        outputs:
          - implementation
      4:
        name: Implementation
        purpose: >
          Define implementation details,
          interfaces, models, configuration,
          storage, and development information.
        description: >
          Defines technical implementation,
          interfaces, schemas, storage,
          configuration, and development details.
        prerequisites:
          - layer-1
          - layer-2
          - layer-3
        outputs:
          - operation
      5:
        name: PostImplementation
        purpose: >
          Capture discoveries, observations,
          lessons learned, retrospectives,
          and historical project knowledge.
        description: >
          Captures observations, lessons,
          findings, retrospectives,
          and historical knowledge.
        prerequisites:
          - layer-4
        outputs:
          - future-improvements
      9:
        name: Reference
        purpose: >
          Maintain authoritative,
          evergreen project reference material.
        description: >
          Permanent reference documents,
          glossary, appendices, references,
          and standards.
        prerequisites: []
        outputs:
          - all-layers
