tenant: null

source:
  author: Prismata Architecture Team
  created: 2026-11-14
  last-updated: 2026-11-18
  path: canonical/kadd/5-post-implementation/5-01-research.yaml

metadata:
  name: Research
  description: >
    Defines the structure, purpose, governance,
    capture, validation, and preservation of
    research conducted throughout the Prismata
    ecosystem lifecycle.

  tags:
    - prismata
    - research
    - discovery
    - experimentation
    - validation
    - knowledge
    - governance
    - post-implementation

relations:
  domain:
    - Research
    - Knowledge Acquisition
    - Validation
    - Discovery

  scope:
    - Research Records
    - Research Practices
    - Research Governance
    - Research Outcomes
    - Research Preservation

  exclusions:
    - Lessons Learned
    - Retrospectives
    - Architectural Decisions
    - Requirements
    - Roadmap Management

  priority: high

  conflict-resolution: >
    Research artifacts preserve observations,
    experiments, discoveries, hypotheses,
    investigations, and findings. Research
    does not create architectural law and
    shall not override approved architectural
    decisions without governance review.

  imports:
    - prismata.kad.reference.glossary
    - prismata.kad.reference.references
    - prismata.kad.reference.appendices
    - prismata.kad.definitions.documentation-discipline
    - prismata.kad.definitions.vision
    - prismata.kad.definitions.project-profile
    - prismata.kad.definitions.concepts
    - prismata.kad.definitions.principles
    - prismata.kad.definitions.doctrines
    - prismata.kad.definitions.foundational-narratives
    - prismata.kad.architecture.systems
    - prismata.kad.architecture.subsystems
    - prismata.kad.architecture.relationships
    - prismata.kad.architecture.decisions
    - prismata.kad.planning.requirements
    - prismata.kad.planning.risks
    - prismata.kad.planning.roadmap
    - prismata.kad.implementation.interfaces
    - prismata.kad.implementation.data-model
    - prismata.kad.implementation.storage
    - prismata.kad.implementation.configuration
    - prismata.kad.implementation.development

notes:
  - Research may validate existing assumptions or challenge them.
  - Research records should preserve both successful and unsuccessful findings.
  - Research artifacts should remain discoverable after decisions are made.
  - Experimental failures may possess equal long-term value to successful outcomes.
  - Research findings should contribute to future lessons learned records where appropriate.
  - Research records remain evidence-preserving and non-normative unless explicit governance converts them into approved decisions, policy, or architecture revisions.
  - Research records participate in the KADD proposal-review-archive workflow so that updates, approvals, and archival decisions remain traceable.

content:
  status:
    maturity: developing
    last-review-date: 2026-11-15
    review-status: passed-review
    review-cycle: 3 months
    review-past-due: false
    next-review-date: 2027-02-15

  purpose: >
    Preserve validated learning, research outcomes,
    investigations, experiments, observations,
    evaluations, and findings that contribute
    to ecosystem understanding.

  governance:
    owner: prismata-architecture-team
    review-frequency: quarterly
    review-principle: research captures validated findings and remains discoverable without becoming normative unless explicitly adopted through governance review
    archive-policy: preserve-by-status
    proposal-review-lifecycle:
      - proposed
      - in-review
      - changes-requested
      - approved
      - implemented
      - archived
    proposal-workflow:
      proposal-directory: .github/.agent-reports/kadd/proposals
      review-directory: .github/.agent-reports/kadd/reviews
      archive-directory: .github/.agent-reports/kadd/archive
      historical-directory: .github/.agent-reports/kadd/historical
      decision-principle: >
        Research updates and governance proposals shall remain traceable through
        review, approval, implementation, and archival status.

  research-principles:

    - Preserve evidence.
    - Preserve context.
    - Preserve assumptions.
    - Preserve unsuccessful outcomes.
    - Preserve rationale.
    - Favor validation over speculation.
    - Separate observation from conclusion.

  research-standards:
    evidence-quality:
      - findings must be traceable to observations, experiments, or documented evidence
      - assumptions must be stated explicitly
      - conclusions must distinguish observation from inference
      - unresolved questions must be recorded for follow-on research
    source-traceability:
      - related requirements, decisions, and implementation artifacts should be referenced
      - evidence should remain discoverable and addressable
    lifecycle-governance:
      - research may transition from exploratory to validated only after review
      - inconclusive or invalid findings remain preserved as evidence, not discarded

  research-lifecycle:
    - proposed
    - active
    - validated
    - adopted
    - archived

  research-categories:
    architectural:
      description: >
        Research related to architecture,
        governance, structure, composition,
        and ecosystem evolution.

    technical:
      description: >
        Research related to implementation,
        performance, scalability, interoperability,
        tooling, or platform design.

    operational:
      description: >
        Research related to deployment,
        maintenance, administration,
        support, or ecosystem operation.

    exploratory:
      description: >
        Early-stage investigations intended
        to evaluate opportunities, concepts,
        or future directions.

  research-record-model:
    required-elements:
      - title
      - objective
      - scope
      - assumptions
      - methodology
      - observations
      - findings
      - conclusions

    optional-elements:
      - references
      - recommendations
      - follow-up-actions
      - supporting-artifacts

  governance-rules:
    - Research records should be addressable.
    - Research records should be discoverable.
    - Research records should be preserved.
    - Research should identify assumptions explicitly.
    - Conclusions should be supported by evidence.
    - Research may inform future governance decisions.
    - Research does not independently establish architectural law.

  outcomes:
    positive:
      description: >
        Findings supporting a hypothesis,
        proposal, approach, or design.

    negative:
      description: >
        Findings contradicting a hypothesis,
        proposal, approach, or design.

    inconclusive:
      description: >
        Findings insufficient to determine
        a clear outcome.

  relationships:
    inputs:
      - requirements
      - risks
      - proposals
      - lessons-learned
      - retrospectives

    outputs:
      - findings
      - recommendations
      - follow-up-research
      - governance-proposals
      - lessons-learned

  closing-statement: >
    Research preserves validated learning for
    future consumers of ecosystem knowledge.
    Its purpose is not merely to discover
    answers but to preserve understanding in
    a durable, discoverable, and governable
    form.
