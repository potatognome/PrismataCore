content:

  lesson-records:

    - id: LLR-001
      udi: dev.prismata.lessons.architecture-refactors-are-usually-concept-refactors
      title: Architecture Refactors Are Usually Concept Refactors
      status: accepted
      category: architecture

      context: >
        Multiple significant refactoring cycles occurred during
        ecosystem evolution.

      observation: >
        Most refactors were triggered by concept refinement,
        ownership changes, responsibility changes, or boundary
        clarification rather than implementation defects.

      lesson: >
        Architectural instability typically originates from
        incomplete conceptual understanding rather than poor code.

      evidence:
        - Metadata ownership revisions
        - Responsibility redistribution
        - Architectural boundary realignment

      implications:
        - Concepts should stabilize before implementation.
        - Responsibilities require explicit ownership.
        - Architecture reviews provide greater value than early optimization.

      recommendations:
        - Prioritize concept development.
        - Validate responsibilities early.
        - Review architecture before implementation.

      related:
        - 1-03-concepts.yaml
        - 2-01-systems.yaml
        - 2-04-decisions.yaml

    - id: LLR-002
      udi: dev.prismata.lessons.understanding-architecture-reduces-dependence-on-code
      title: Understanding Architecture Reduces Dependence On Code
      status: accepted
      category: architecture

      context: >
        Project understanding previously depended heavily upon
        remembering implementation details.

      observation: >
        Architectural understanding was often lost whenever
        implementation details became outdated or unfamiliar.

      lesson: >
        Understanding architecture is more sustainable than
        understanding implementation.

      evidence:
        - Frequent rediscovery of project structure
        - Implementation-specific reasoning dominating discussions

      implications:
        - Architectural artifacts should be durable.
        - Project understanding should not depend on source code.

      recommendations:
        - Maintain architecture-first documentation.
        - Preserve architecture independently of code.

      related:
        - 1-01-vision.yaml
        - 2-01-systems.yaml
        - 2-03-relationships.yaml

    - id: LLR-003
      udi: dev.prismata.lessons.knowledge-is-more-durable-than-implementation
      title: Knowledge Is More Durable Than Implementation
      status: accepted
      category: governance

      context: >
        Multiple implementation approaches were evaluated
        while project intent remained largely stable.

      observation: >
        Implementation changed repeatedly while concepts,
        architecture, and direction remained consistent.

      lesson: >
        Knowledge assets have a longer useful lifespan
        than implementation assets.
      
      evidence:
        - Repeated architectural evolution
        - Stable conceptual direction

      