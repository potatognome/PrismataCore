metadata:
  name: Architectural Decisions
  description: Canonical architectural positions that define how Prismata is intended to be structured, governed, implemented, secured, and evolved.
  tags:
    - prismata
    - decisions
    - architecture
    - adr
    - governance

relations:
  domain:
    - Architecture
    - Governance
    - Standards
  scope:
    - Architectural Positions
    - Ecosystem Decisions
    - Structural Decisions
  exclusions:
    - Historical Decisions
    - Requirements
    - Roadmaps
    - Implementation Details
    - Research Findings
    - Retrospectives
  priority: critical
  conflict-resolution: Architectural decisions take precedence over implementation preferences and localized design choices.
  imports:
    - prismata.kad.definitions.documentation-discipline
    - prismata.kad.definitions.vision
