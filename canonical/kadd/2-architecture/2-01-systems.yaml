metadata:
  name: Prismata Systems
  description: High-level architectural systems and ecosystem layers that compose the Prismata ecosystem.
  tags:
    - prismata
    - systems
    - architecture
    - ecosystem
    - layers

relations:
  domain:
    - System Architecture
    - Ecosystem Architecture
