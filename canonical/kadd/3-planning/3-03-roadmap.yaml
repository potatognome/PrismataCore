      udi: prismata.kadd.roadmap.ecosystem-consumer-support
      title: Ecosystem Consumer Support
      status: planned
      objective: Improve the ability of external ecosystem projects to adopt and leverage Prismata standards, capabilities, and governance models.
      success-metric: Consumer projects can integrate with Prismata using documented standards and registries.
      dependencies:
        adrs:
          - prismata.kadd.adr.capability-based-composition
          - prismata.kadd.adr.knowledge-organization-through-registries-and-indices
        requirements:
          - prismata.kadd.requirements.capability-discoverability
          - prismata.kadd.requirements.asset-discoverability
