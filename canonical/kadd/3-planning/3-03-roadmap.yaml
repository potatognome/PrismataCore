    - id: ROADMAP-017
      udi: prismata.kadd.roadmap.tenant-archive-stewardship
      title: Tenant Archive Stewardship
      status: planned
      objective: Expand preservation, archival, and stewardship capabilities for tenant ecosystems.
      success-metric: Tenant archives are preserved, searchable, and recoverable.
      dependencies:
        adrs:
          - prismata.kadd.adr.knowledge-preservation-over-replacement
