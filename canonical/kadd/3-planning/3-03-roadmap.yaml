    - id: ROADMAP-018
      udi: prismata.kadd.roadmap.ecosystem-knowledge-indexing
      title: Ecosystem Knowledge Indexing
      status: planned
      objective: Improve classification, indexing, relationships, discoverability, and knowledge navigation.
      success-metric: Ecosystem knowledge is discoverable through indexed relationships.
      dependencies:
        adrs:
