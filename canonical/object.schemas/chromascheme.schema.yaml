id: prismata.core.schema.chromascheme
udi: prismata.core.schema.chromascheme
kind: schema
version: 1.0.0
tenant: null

source:
  path: canonical/object.schemas/chromascheme.schema.yaml
  repo: PrismataCore
  imported_at: "2026-10-13T00:00:00Z"

metadata:
  name: ChromaScheme Schema
  target_kind: chromascheme
  naming:
    file_suffix: .chromascheme.object.yaml
  description: Canonical structure for chroma palettes, role mapping, and metadata.
  tags:
    - chroma
    - palette
    - core

relations:
  depends_on:
    - prismata.core.schema.colour-role
    - prismata.core.schema.colour-scheme
  provides:
    - prismata.core.schema.chromascheme
  conflicts_with: []

validation:
  schema: prismata.core.schema.chromascheme
