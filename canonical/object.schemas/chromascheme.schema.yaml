notes:
  - Assumes imported Chromaverse content normalized to canonical PrismataCore naming.
  
content:
  type: object
  fields:
    colour_set:
      type: array
      description: Required. Canonical array of colour definitions (from Prismata Meta `colour_set`).
      items:
        type: object
    geometry:
      type: object
      description: Optional. Geometry configuration for chroma generation (parageometric, overlays, expressions).
    roles:
      type: object
      description: Optional.  Semantic chroma role mapping.  Overwritten by colour_role object definitions.
    metadata:
      type: object
      description: Optional. Chroma provenance and semantic metadata.
  required:
    - colour_set
    - geometry
    - roles
    - metadata

