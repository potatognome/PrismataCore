          type: string
          description: Required. Background colour in rgb format. E.g., "rgb(0, 0, 0)".
        fg:
          type: string
          description: Required. Foreground colour in rgb format. E.g., "rgb(255, 255, 255)".
        style:
          type: string
          description: Optional. Style information for the role (e.g., bold, italic).
