content:
  type: object
  fields:
    glyphs:
      type: object
      description: Mapping of glyph keys to single-character strings for border rendering (e.g. TL, TR, H, V).
      additionalProperties:
        type: string
    thickness:
      type: integer
      minimum: 0
      description: Optional. Border width in px-like units. Defaults to 1 when not specified.
    padding:
      type: integer
      minimum: 0
      description: Optional. Padding width in px-like units.  Defaults to 0 when not specified.
    border_role:
      type: string
      description: Optional. Border FG|BG colour and styling token.  Defaults to the standard border colour & style role if not specified.
  required:
    - glyphs