id: prismata.core.schema.menu-item
udi: prismata.core.schema.menu-item
kind: schema
version: 1.0.0
tenant: null

source:
  path: canonical/object.schemas/menu-item.schema.yaml
  repo: PrismataCore
  imported_at: "2026-10-13T00:00:00Z"

metadata:
  name: Menu-Item Schema
  target_kind: menu-item
  naming:
    file_suffix: .menu-item.object.yaml
  description: Canonical menu item schema including UDI, capability, type, order, action, and selection semantics.
  tags:
    - menu-item
    - capability
    - interaction

relations:
  depends_on:
    - prismata.core.schema.menu
  provides:
    - prismata.core.schema.menu-item
  conflicts_with: []

validation:
  schema: prismata.core.schema.menu-item
  status: valid
  errors: []

notes:
  - The menu-item schema includes the required capability, ordering, and action fields without tenant or preview-specific data.

content:
  type: object
  fields:
    # Action and capability fields.  Action is optional, capability is required.
    action:
      type: string
      description: Optional. Canonical action handle.
    capability:
      type: string
      description: Required. UDI capability for the menu item.
    inject_into_pane:
      type: string
      description: Optional. Pane UDI into which the activated menu-items capability output should be injected. (displayed in the specified pane)

    order:
      type: integer
      description: Optional. Numeric menu ordering index.  Default order is based on listed order of menu-item objects within the menu object.
    hotkey:
      type: string
      description: Optional. Menu-item keyboard shortcut for the menu item.

    # Visual and styling fields - headers, icons, borders, and colour schemes.  Only label is required.
    label:
      type: string
      description: Required. Visible menu-item label.
    icon:
      type: string
      description: Optional. Menu item icon identifier appears with label if specified. Default is empty string.
    headers:
      type: array
      items:
        type: string
        description: Optional. Array of menu item header UDIs containing text and styling information.
      notes:
        - These can be used to add additional content to the menu item.  Visibility and styling are controlled through the header object.
    footers:
      type: array
      items:
        type: string
        description: Optional. Array of menu item footer UDIs containing text and styling information.
      notes:
        - These can be used to add additional content to the menu item.  Visibility and styling are controlled through the footer object.
    tooltip:
      type: string
      description: Optional. Tooltip text for the menu item.
    
    #  Styling Object Fields Reference UDI for border pattern, border role, and colour scheme.
    colour_scheme:
      type: string
      description: Optional. Menu item colour scheme UDI.  Default colour scheme will be applied if not specified.
    colour_role:
      type: string
      description: Colour is Optional. Menu item colour role UDI.  No colour role will be applied if not specified.
      notes:
        - Colour roles typically control the background colour of the menu-item.  
        - A foreground may apply as a default text colour if not colour key text linting is applied.
    border_pattern:
      type: string
      description: Border is Optional. Menu item border pattern UDI.  Default is none.
    border_role:
      type: string
      description: Border is Optional. Menu item border colour & style role UDI.  Default border colour & style role will be applied if not specified.

    # Visibility and enablement fields.  All optional.
    visibility_mode:
      type: string
      description: Optional. Menu item visibility mode (e.g., static, conditional).  Default is static (always on).
    visibility_condition:
      type: string
      description: Optional. Condition under which the menu item is visible.  Applies only when visibility_mode is set to conditional.
    enable_mode:
      type: string
      description: Optional. Menu item enable mode (e.g., enabled, conditional, disabled).  Default is enabled.
    enable_condition:
      type: string
      description: Optional. Condition under which the menu item is enabled.  Applies only when enable_mode is set to conditional.

    

  required:
    - label
    - capability