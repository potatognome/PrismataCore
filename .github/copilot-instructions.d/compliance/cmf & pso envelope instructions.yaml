content:
  global-rules: |
    - Define structure through schemas rather than hard-coded behavior.
    - Prefer declarative configuration over imperative implementation.
    - Maintain separation between schema, data, and presentation.
    - Ensure schema changes remain backward compatible whenever possible.
    - Centralize reusable definitions and prevent duplication.

  global-constraints: |
    - No undocumented schema properties.
    - No implicit field definitions.
    - No hard-coded business logic embedded in schema definitions.
    - All schema changes must remain machine-parseable and deterministic.

  activation:
    when: |
      - Creating or modifying schemas.
      - Designing metadata models.
      - Defining configuration objects.
      - Creating validation models.
      - Refactoring schema-driven systems.

    when-not: |
      - Editing non-schema content.
      - Updating unrelated documentation.
      - Working exclusively with third-party generated artifacts.

  parameters:
    - name: strict-validation
      type: boolean
      default: true
      description: Require explicit validation rules for all schema fields.

    - name: allow-custom-fields
      type: boolean
      default: false
      description: Permit implementation-specific fields outside the schema definition.

